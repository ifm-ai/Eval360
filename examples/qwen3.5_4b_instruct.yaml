remote_model:
  base_name: qwen3.5-4b-instruct
  path: Qwen/Qwen3.5-4B
  revision: null
model_type: instruct
parser_type: mc_answer
name_modifier: null
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 64
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 8  # equals --tensor-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "8"
  - "--trust-remote-code"
openai_kwargs:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0
  max_tokens: 32768
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
