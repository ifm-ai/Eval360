remote_model:
  base_name: k2-think-v2
  path: IFM/K2-Think-V2
  revision: null
model_type: instruct
parser_type: boxed
name_modifier: null
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 300
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 8  # equals --tensor-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "8"
  - "--trust-remote-code"
openai_kwargs:
  extra_body: {"chat_template_kwargs": {"reasoning_effort": "high"}}
  temperature: 0.7
  max_tokens: 65536
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
