remote_model:
  base_name: qwen3_4b
  path: Qwen/Qwen3-4B
  revision: null
model_type: instruct 
parser_type: boxed
name_modifier: null
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 300
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 8  # equals --tensor-parallel-size x --data-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "1"
  - "--data-parallel-size"
  - "8"
  - "--trust-remote-code"
openai_kwargs:
  temperature: 1.0
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
