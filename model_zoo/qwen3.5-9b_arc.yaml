remote_model:
  base_name: qwen3.5-9b
  path: Qwen/Qwen3.5-9B
  revision: null
model_type: instruct
parser_type: mc_answer
name_modifier: arc
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 8
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 1  # equals --tensor-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "1"
  - "--trust-remote-code"
  - "--generation-config"
  - "vllm"
  - "--max-model-len"
  - "16384"
  - "--max-num-seqs"
  - "8"
openai_kwargs:
  max_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  presence_penalty: 1.5
  extra_body:
    top_k: 20
    chat_template_kwargs:
      enable_thinking: false
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
