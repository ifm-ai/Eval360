remote_model:
  base_name: qwen3-1.7b
  path: Qwen/Qwen3-1.7B
  revision: null
model_type: base
parser_type: passthrough
name_modifier: -aptbench
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 30
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 8  # equals --tensor-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "8"
  - "--trust-remote-code"
  - "--max-model-len"
  - "65536"
openai_kwargs:
  temperature: 0.0
  max_tokens: 30
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
