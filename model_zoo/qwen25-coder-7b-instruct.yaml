remote_model:
  base_name: qwen25-coder-7b-instruct
  path: Qwen/Qwen2.5-Coder-7B-Instruct
  revision: null
model_type: instruct
parser_type: code
name_modifier: null
venv_path: "/<SERVING_VENV>/bin/activate"
max_simultaneous_requests: 300
max_time_to_deploy: 900
serving_slurm_resources:
  gpus_per_node: 1  # equals --tensor-parallel-size
vllm_cli_args:
  - "--tensor-parallel-size"
  - "1"
  - "--trust-remote-code"
openai_kwargs:
  temperature: 0.0
  max_tokens: 2048
owner: "<OWNER>"
ready: true
output_path: "/<OUTPUT_ROOT>"
